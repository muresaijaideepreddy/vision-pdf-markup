[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markupdoc"
version = "0.1.0"
description = "An experimental scanned-markup to Word editing pipeline"
requires-python = ">=3.10"
dependencies = ["lxml>=4.9", "pypdf>=4", "pypdfium2>=4", "Pillow>=10"]

[project.optional-dependencies]
demo = ["python-docx>=1.1", "reportlab>=4"]
test = ["pytest>=8", "python-docx>=1.1", "reportlab>=4"]

[project.scripts]
markupdoc = "markupdoc.cli:main"

[tool.setuptools.packages.find]
include = ["markupdoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
